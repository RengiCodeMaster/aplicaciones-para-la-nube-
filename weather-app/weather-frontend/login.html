<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ClimaApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex-center bg-gradient">
    <div class="card glass-effect">
        <h1 class="title">Bienvenido</h1>
        <p class="subtitle">Inicia sesión para consultar el clima</p>
        
        <form id="loginForm" class="form-container">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="1234" required>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
            <p id="errorMessage" class="error-text" style="display: none;">Credenciales inválidas.</p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('jwt_token', data.token);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorMessage').innerText = 'Error de conexión con el servidor.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
