name: Deploy Weather App to AWS EC2

on:
  push:
    branches:
      - main  # Ejecuta el despliegue cuando haces push a main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Asegurarse de que el directorio del proyecto exista
            if [ ! -d "$HOME/app" ]; then
              echo "Clonando repositorio por primera vez..."
              git clone https://github.com/${{ github.repository }}.git $HOME/app
            fi

            # 2. Entrar a la carpeta del proyecto
            cd $HOME/app

            # 3. Traer los cambios más recientes
            git pull origin main

            # 4. Reconstruir y levantar los contenedores con Docker Compose
            docker compose down
            docker compose up -d --build

            # 5. Limpieza de imágenes antiguas para ahorrar espacio en la t3.micro
            docker image prune -f
